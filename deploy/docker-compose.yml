# Déploiement du serveur relais + monde (apps/server) avec Docker Compose.
#
# Depuis ce dossier :
#   docker compose up -d --build
#
# Le contexte de build (`..`) est la racine du dépôt : voir
# apps/server/Dockerfile et deploy/README.md pour le détail. `rebuild` n'est
# nécessaire qu'après un changement de code — pas après un changement des
# seules variables d'environnement ci-dessous (`docker compose up -d` suffit).

services:
  rimlike-server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: rimlike-server
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # Fichier unique d'état du monde (colonies, joueurs, caravanes) : voir
      # apps/server/src/persistence.ts. Nommé plutôt que lié à un chemin hôte
      # pour rester portable ; `docker volume inspect` en donne l'emplacement
      # réel si besoin d'y accéder directement (sauvegarde, inspection).
      - rimlike-world-data:/data
    environment:
      # Graine du globe généré au premier démarrage (1 par défaut). La
      # changer régénère un globe DIFFÉRENT : voir deploy/README.md
      # (« Changer le globe ») avant d'y toucher sur un serveur qui a déjà
      # des colonies — le fichier d'état existant serait mis en quarantaine.
      - WORLD_SEED=1
      # Subdivisions de l'icosaèdre : 4 = 2 562 cases (défaut, correct pour
      # tester), 5 = 10 242 cases (recommandé en production). 6 va au-delà
      # mais alourdit sensiblement `GET /world` et la mémoire du serveur.
      - WORLD_SUBDIVISIONS=4
      # Échelle du jour imposée à toutes les salles (1 à 120, 30 par défaut).
      # C'est LE réglage du rythme du monde : à 30, un jour de jeu dure
      # 14 400 x 30 = 432 000 ticks, soit deux heures réelles ; une heure de
      # jeu vaut cinq minutes, une saison trente heures, une année cinq jours.
      # L'horloge du monde (caravanes, marchands, temps gelé) en découle : il
      # n'y a plus de WORLD_HOUR_MS à régler. À décider AVANT la première
      # colonie — les sims déjà conservés gardent leur échelle.
      - WORLD_DAY_SCALE=30
      # WORLD_HOUR_MS : surcharge de l'heure de jeu réservée aux tests
      # d'intégration (voir apps/server/README.md). Ne pas la définir ici.
      # - WORLD_HOUR_MS=300000
      # Dé-commenter pour changer le port d'écoute interne (PORT) ou
      # l'interface (HOST) ; garder cohérent avec le mappage `ports:` ci-dessus.
      # - PORT=8787
      # - HOST=0.0.0.0
      # Dé-commenter pour changer la période du tick du monde (avancement
      # des caravanes, diffusion), en millisecondes (5000 par défaut).
      # - CARAVAN_TICK_MS=5000
      # Dé-commenter pour désactiver la persistance disque (mode mémoire,
      # tout est perdu à l'arrêt) : voir apps/server/README.md.
      # - WORLD_PERSIST=0

volumes:
  rimlike-world-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sim:
    name: sim (tests + lints de déterminisme)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  client:
    name: client (wasm + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:client

  network:
    name: réseau (protocole + serveur relais)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rimlike/protocol typecheck
      - run: pnpm --filter server typecheck
      - run: pnpm test:protocol
      - run: pnpm test:server

  world:
    name: monde (globe, biomes, itinéraires)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rimlike/world typecheck
      - run: pnpm test:world

  image:
    name: image serveur (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t rimlike-server:ci .
      - run: docker run -d --rm -p 8787:8787 -e WORLD_SUBDIVISIONS=2 -e WORLD_PERSIST=0 --name rimlike-ci rimlike-server:ci
      - run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs rimlike-ci
          exit 1
      - run: curl -fsS -o /dev/null -w "world: %{http_code} %{size_download} octets\n" http://127.0.0.1:8787/world
      - if: always()
        run: docker stop rimlike-ci || true
